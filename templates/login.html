<!DOCTYPE html>
<html lang="en" data-theme="anchor_classic" data-doodles="off">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Anchor Study</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
        }

        .auth-page {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow: hidden;
            background: #f5f7fb;
        }

        .auth-page::before {
            content: "";
            position: absolute;
            top: -170px;
            right: -130px;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            background: rgba(233, 189, 98, 0.12);
            pointer-events: none;
        }

        .auth-page::after {
            content: "";
            position: absolute;
            bottom: -200px;
            left: -140px;
            width: 440px;
            height: 440px;
            border-radius: 50%;
            background: rgba(16, 29, 53, 0.06);
            pointer-events: none;
        }

        .auth-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            margin: auto;
        }

        .auth-brand {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
        }

        .auth-brand a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .auth-logo {
            display: block;
            width: 190px;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        .auth-card {
            padding: 38px;
            border: 1px solid #e7eaf0;
            border-radius: 22px;
            background: #ffffff;
            box-shadow: 0 18px 55px rgba(16, 29, 53, 0.08);
        }

        .auth-header {
            margin-bottom: 28px;
            text-align: center;
        }

        .auth-header .eyebrow {
            margin: 0 0 12px;
            color: #b48735;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .auth-header h1 {
            margin: 0 0 12px;
            color: #101d35;
            font-size: clamp(25px, 5vw, 31px);
            font-weight: 750;
            line-height: 1.25;
        }

        .auth-header > p:last-child {
            margin: 0;
            color: #697386;
            font-size: 14px;
            line-height: 1.7;
        }

        .auth-error {
            margin-bottom: 20px;
            padding: 12px 14px;
            border: 1px solid #f0caca;
            border-radius: 10px;
            background: #fff1f1;
            color: #a12626;
            font-size: 13px;
            line-height: 1.5;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .auth-form .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 0;
        }

        .auth-form label {
            color: #26344c;
            font-size: 13px;
            font-weight: 650;
        }

        .auth-form input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #dce1e9;
            border-radius: 10px;
            outline: none;
            background: #ffffff;
            color: #101d35;
            font: inherit;
            font-size: 14px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-form input::placeholder {
            color: #9aa3b2;
        }

        .auth-form input:focus {
            border-color: #c69a45;
            box-shadow: 0 0 0 3px rgba(233, 189, 98, 0.2);
        }

        .forgot-password {
            display: flex;
            justify-content: flex-end;
            margin-top: -8px;
        }

        .forgot-password a {
            color: #8d6a29;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .auth-button {
            width: 100%;
            min-height: 49px;
            margin-top: 2px;
            border: none;
            border-radius: 10px;
            background: #101d35;
            color: #ffffff;
            font-size: 14px;
            font-weight: 650;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .auth-button:hover {
            background: #1b3154;
            transform: translateY(-1px);
        }

        .auth-button:focus-visible {
            outline: 3px solid #e9bd62;
            outline-offset: 3px;
        }

        .auth-footer {
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid #edf0f4;
            text-align: center;
        }

        .auth-footer p {
            margin: 0;
            color: #697386;
            font-size: 13px;
            line-height: 1.7;
        }

        .auth-footer a {
            color: #8d6a29;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .auth-page {
                padding: 28px 16px;
            }

            .auth-logo {
                width: 160px;
            }

            .auth-brand {
                margin-bottom: 22px;
            }

            .auth-card {
                padding: 28px 22px;
                border-radius: 18px;
            }

            .auth-header {
                margin-bottom: 24px;
            }
        }

        @media (max-height: 650px) {
            .auth-page {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <main class="auth-page">
        <div class="auth-container">

            <div class="auth-brand">
                <a href="/">
                    <img
                        src="{{ url_for('static', filename='images/anchor-study-logo.png') }}"
                        alt="Anchor Study logo"
                        class="auth-logo"
                    >
                </a>
            </div>

            <div class="auth-card">
                <div class="auth-header">
                    <p class="eyebrow">WELCOME BACK</p>
                    <h1>Sign in to Anchor Study.</h1>
                    <p>Pick up where you left off and keep moving forward.</p>
                </div>

                {% if error %}
                    <div class="auth-error" role="alert">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div class="forgot-password">
                        <a href="/forgot-password">Forgot your password?</a>
                    </div>

                    <button type="submit" class="primary-button auth-button">
                        Sign In
                    </button>
                </form>

                <div class="auth-footer">
                    <p>
                        Don't have an account?
                        <a href="{{ url_for('signup') }}">Create one</a>
                    </p>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
